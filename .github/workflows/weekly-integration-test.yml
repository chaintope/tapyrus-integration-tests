# Weekly cross-repo integration test (tapyrus-core + tapyrus-signer + tapyrus-seeder).
# See doc/weekly-integration-test-plan.md for the full design; this workflow's steps
# map 1:1 onto that doc's section 3 ("Step-by-step CI flow").
#
name: Weekly Cross-Repo Integration Test

on:
  schedule:
    # weekly, Sunday 03:00 UTC (Sunday 12:00 noon JST)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      # lets a manual run target a specific PR/branch of any of the
      # three repos, instead of always chasing master
      core_repo_ref:
        description: 'tapyrus-core ref (branch/tag/sha)'
        default: 'master'
      signer_repo_ref:
        description: 'tapyrus-signer ref (branch/tag/sha)'
        default: '163_federationChangeTomlSetup' # see config/repos.env for why
      seeder_repo_ref:
        description: 'tapyrus-seeder ref (branch/tag/sha) -- master does not yet include the fixes in doc/work-done.md; override once a fixed branch is pushed'
        default: 'master' # see config/repos.env for why; plan doc section 4c wants this pinned once a fixed branch exists, not tracking master long-term

      # --- reorg shape ---
      chain_height_before_reorg:
        description: 'Baseline chain height to reach (with all 7 nodes connected) before splitting for the reorg'
        default: '30'
      reorg_loser_blocks:
        description: 'Blocks the losing group builds past the baseline'
        default: '10'
      reorg_winner_margin:
        description: 'Extra blocks the winning group builds beyond reorg_loser_blocks (winner total = loser + margin) -- keeping this a margin, not a second absolute count, makes an accidental tie/shorter-winner structurally impossible'
        default: '2'

      # --- transaction mix ---
      tx_total_count:
        description: 'Total number of transactions generated across the run'
        default: '20'
      tx_tpc_percent:
        description: 'Percent of tx_total_count that are plain TPC transfers (remainder is colored-coin transactions) -- e.g. 30 means a 30:70 tpc:colored split'
        default: '30'
      tx_interval_seconds:
        description: 'Seconds between each generated transaction'
        default: '30'

      # --- block interval ---
      round_duration_seconds:
        description: 'tapyrus-signerd round-duration -- see doc/work-done.md: 60s avoids the InvalidBlock race a shorter duration hits'
        default: '60'

      # --- rotation (scenario step 6) ---
      rotation_height_offset:
        description: 'Blocks ahead of the current tip to schedule signer-set-b''s takeover height'
        default: '10'

      # --- max block size change (scenario step 7) ---
      max_block_size_new:
        description: 'New max-block-size value pushed via the xfield change'
        default: '2000000'

      # --- determinism ---
      prng_seed_base:
        description: 'Base seed for per-node PRNGs (combined with node index) -- override to reproduce a specific past run''s transaction sequence'
        default: '' # empty means "use github.run_id", see the tx-generation step once it exists

      # --- misc ---
      network_id:
        description: 'Tapyrus dev network id, used for genesis/seeder/RPC network selection'
        default: '1905960821'
      slack_log_tail_lines:
        description: 'Lines of the implicated container''s log to inline in the Slack failure report (plan doc section 3a)'
        default: '100'
      docker_build_platform:
        description: 'Docker --platform for image builds -- local verification was linux/arm64 only (see doc/work-done.md); leave empty to let Docker pick the runner''s native platform'
        default: ''

env:
  # Every var below is a workflow_dispatch input mapped with a literal fallback, so
  # schedule-triggered runs (where the `inputs` context doesn't apply) still get the
  # same defaults a manual run would see without overriding anything.
  CORE_REPO_REF: ${{ inputs.core_repo_ref || 'master' }}
  SIGNER_REPO_REF: ${{ inputs.signer_repo_ref || '163_federationChangeTomlSetup' }}
  SEEDER_REPO_REF: ${{ inputs.seeder_repo_ref || 'master' }}
  CHAIN_HEIGHT_BEFORE_REORG: ${{ inputs.chain_height_before_reorg || '30' }}
  REORG_LOSER_BLOCKS: ${{ inputs.reorg_loser_blocks || '10' }}
  REORG_WINNER_MARGIN: ${{ inputs.reorg_winner_margin || '2' }}
  TX_TOTAL_COUNT: ${{ inputs.tx_total_count || '20' }}
  TX_TPC_PERCENT: ${{ inputs.tx_tpc_percent || '30' }}
  TX_INTERVAL_SECONDS: ${{ inputs.tx_interval_seconds || '30' }}
  ROUND_DURATION: ${{ inputs.round_duration_seconds || '60' }} # see doc/work-done.md -- 60s avoids the InvalidBlock race a shorter duration hits
  ROTATION_HEIGHT_OFFSET: ${{ inputs.rotation_height_offset || '10' }}
  MAX_BLOCK_SIZE_NEW: ${{ inputs.max_block_size_new || '2000000' }}
  PRNG_SEED_BASE: ${{ inputs.prng_seed_base || github.run_id }}
  NETWORK_ID: ${{ inputs.network_id || '1905960821' }}
  SLACK_LOG_TAIL_LINES: ${{ inputs.slack_log_tail_lines || '100' }}
  DOCKER_BUILD_PLATFORM: ${{ inputs.docker_build_platform || '' }}
  CORE_RPC_PORT: '12381'
  CORE_RPC_USER: 'rpcuser'
  CORE_RPC_PASS: 'rpcpassword'
  # NOT a variable: signer count (3) / threshold (2). The 7-node topology in
  # docker/docker-compose.yml is hardcoded 1:1 with exactly 3 signers (signer-0/1/2 ->
  # core-1a/2a/3a) -- changing the count would mean re-deriving the whole topology
  # (section 4b), not just passing a different number into the existing scripts.

jobs:
  integration-test:
    runs-on: ubuntu-latest # TODO: confirm a GitHub-hosted runner has enough CPU/disk for 7 core nodes + 3 signers + redis; may need self-hosted
    timeout-minutes: 360 # 4-6h budget, see plan doc section 4c
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # --- section 3 step 1: checkout tapyrus-core, tapyrus-signer, tapyrus-seeder ---
      # All three refs are independently configurable per run via the core_repo_ref /
      # signer_repo_ref / seeder_repo_ref workflow_dispatch inputs above -- see
      # config/repos.env for the URL each ref is checked out against and why
      # SEEDER_REPO_REF's default (master) doesn't yet include the fixes documented in
      # doc/work-done.md.
      - name: Checkout tapyrus-core + tapyrus-signer + tapyrus-seeder
        run: ./scripts/checkout-repos.sh

      # --- section 3 step 2: build both Docker images ---
      - name: Build tapyrus-core image (tapyrus/tapyrusd:master-local)
        # DOCKER_BUILD_PLATFORM defaults to '' (let Docker pick the runner's native
        # platform); local verification (doc/work-done.md) only ever used linux/arm64,
        # so set docker_build_platform=linux/arm64 explicitly if this GitHub-hosted
        # (amd64) build behaves differently and needs comparing against that result.
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus/tapyrusd:master-local -f workdir/tapyrus-core/Dockerfile workdir/tapyrus-core
      - name: Build tapyrus-signer image (tapyrus-signer:federation-setup-review)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus-signer:federation-setup-review workdir/tapyrus-signer
      - name: Build tapyrus-seeder image (tapyrus-seeder:integration-test)
        # TODO: not yet scripted -- see plan doc section 3 step 2 / 4c. The checkout
        # itself (above) is no longer the blocker; this still needs the actual `docker
        # build` invocation against workdir/tapyrus-seeder wired in.
        run: echo "TODO -- not yet scripted -- see plan doc section 3 step 2 / 4c"

      # --- section 3 step 3: offline ceremony (aggpubkey) for signer-set-a ---
      - name: Build tapyrus-setup binary
        run: cd workdir/tapyrus-signer && cargo build --release
      - name: Generate signer-set-a aggpubkey (section 4a steps 1-3)
        run: ./scripts/generate-dev-secrets.sh signer-set-a 3 2

      # --- section 3 step 4: unsigned genesis + genesis-signing ceremony ---
      - name: Build unsigned genesis
        run: echo "TODO -- not yet scripted -- see plan doc section 3 step 4 / doc/work-done.md \"Try it\""
      - name: Sign genesis (section 4a steps 4-7)
        run: TAPYRUS_SETUP_THRESHOLD=2 ./scripts/sign-genesis.sh signer-set-a /tmp/unsigned-genesis.hex secrets/signer-set-a/genesis.hex

      # --- section 3 step 5: docker compose up redis + 7 core + 3 signer-set-a ---
      - name: Bring up redis + 7 core nodes
        run: |
          cd docker
          GENESIS_BLOCK_WITH_SIG=$(cat ../secrets/signer-set-a/genesis.hex) \
            docker compose up -d redis core-1a core-1b core-2a core-2b core-3a core-3b core-7
      - name: Collect coinbase addresses from each first-layer node
        run: |
          for port in 12381 12383 12385; do
            curl -s --user "$CORE_RPC_USER:$CORE_RPC_PASS" --data-binary \
              '{"jsonrpc":"1.0","id":"t","method":"getnewaddress","params":[]}' \
              -H 'content-type: text/plain;' "http://127.0.0.1:$port/" | jq -r .result
          done > /tmp/addrs.txt
          printf 'core-1a\ncore-2a\ncore-3a\n' > /tmp/core-rpc-hosts.txt
      - name: Assemble signer-set-a configs
        run: |
          ROUND_DURATION="$ROUND_DURATION" ./scripts/assemble-signer-configs.sh signer-set-a 2 \
            /tmp/core-rpc-hosts.txt "$CORE_RPC_PORT" "$CORE_RPC_USER" "$CORE_RPC_PASS" redis 6379 /tmp/addrs.txt
      - name: Bring up signer-set-a
        run: |
          cd docker
          GENESIS_BLOCK_WITH_SIG=$(cat ../secrets/signer-set-a/genesis.hex) \
            docker compose up -d signer-0 signer-1 signer-2

      # --- section 3 step 6: wait for topology ---
      - name: Wait for topology to converge
        # TODO: not yet scripted. Needs to poll getconnectioncount on all 7 nodes for
        # the expected 1/2/1/2/1/2/3 pattern (plan doc section 4b) with the compose
        # healthcheck/depends_on guidance from that same step -- confirmed by hand
        # this session, never encoded into a reusable check.
        run: echo "TODO -- not yet scripted -- see plan doc section 3 step 6"

      # --- section 3 step 7: per-node tx/query/lifecycle + max-block-size change ---
      - name: Per-node tx/query/stop-restart + max-block-size change
        # TODO: no orchestrator exists for this at all (scenario steps 4, 5, 7 in
        # section 2). Will consume: TX_TOTAL_COUNT/TX_TPC_PERCENT/TX_INTERVAL_SECONDS
        # (the tx mix and pacing), PRNG_SEED_BASE (per-node, deterministic per run --
        # combine with each node's own index, plan doc section 2 step 4), and
        # MAX_BLOCK_SIZE_NEW (the xfield value to push and confirm honored).
        run: echo "TODO -- not yet scripted -- see plan doc section 2 steps 4, 5, 7"

      # --- section 3 step 8: reorg (full design in section 4d) ---
      - name: Reorg
        # TODO: not yet scripted as a reusable step. The full 8-step recipe (baseline,
        # split, first group builds, repoint+restart, second group builds longer,
        # reconnect, confirm via getchaintips) was run for real by hand this session --
        # see doc/work-done.md, "The full two-group fork-and-reconverge reorg" -- but
        # every command was typed individually against a live stack, not captured here.
        # Will consume: CHAIN_HEIGHT_BEFORE_REORG (step 1's baseline target),
        # REORG_LOSER_BLOCKS (step 3's target), REORG_WINNER_MARGIN (step 6's target
        # is REORG_LOSER_BLOCKS + REORG_WINNER_MARGIN, not a second absolute number).
        run: echo "TODO -- not yet scripted -- see plan doc section 4d and doc/work-done.md"

      # --- section 3 step 9: aggpubkey rotation (signer-set-b + --xfield handoff) ---
      - name: Generate signer-set-b aggpubkey (offline ceremony)
        run: ./scripts/generate-dev-secrets.sh signer-set-b 3 2
      - name: Sign off rotation handoff + regenerate federations.toml (both entries)
        # TODO: not yet scripted. Needs the --xfield sign/computesig flow (plan doc
        # section 4a, "Federation change") and a federations.toml assembler that can
        # append a second entry -- assemble-signer-configs.sh today only ever writes a
        # single [[federation]] entry, so it can't produce this on its own yet. Will
        # consume ROTATION_HEIGHT_OFFSET (blocks ahead of the current tip to schedule
        # signer-set-b's takeover height).
        run: echo "TODO -- not yet scripted -- see plan doc section 4a / section 3 step 9"

      # --- section 3 step 10: confirm rotation took effect ---
      - name: Confirm rotation took effect
        run: echo "TODO -- not yet scripted -- see plan doc section 3 step 10"

      # --- section 3 step 11: teardown, collect logs ---
      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cd docker
          for c in $(docker compose ps -a --format '{{.Name}}'); do
            docker logs "$c" > "../logs/$c.log" 2>&1 || true
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: logs/
      - name: Teardown
        if: always()
        run: cd docker && docker compose down

      # --- section 3 step 12 / section 3a: send report to slack ---
      - name: Send Slack report
        if: always()
        # TODO: not yet scripted. Contents required per plan doc section 3a: pass/fail
        # + which scenario step it reached, run metadata, both aggpubkeys, and on
        # failure the implicated container(s) plus the last SLACK_LOG_TAIL_LINES lines
        # of their log inlined before the artifact link.
        run: echo "TODO -- not yet scripted -- see plan doc section 3a"

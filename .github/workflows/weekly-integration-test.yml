# Weekly cross-repo integration test (tapyrus-core + tapyrus-signer + tapyrus-seeder).
# See doc/weekly-integration-test-plan.md section 3 for the full step-by-step design,
# doc/work-done.md for known issues/lessons learnt/design decisions, and
# doc/project-plan.md for tracked progress.
#
# schedule/workflow_dispatch run the full-scale scenario; pull_request/push (to this
# repo itself, path-filtered) run the same flow at smoke scale -- see the env: block
# below and doc/work-done.md.
name: Weekly Cross-Repo Integration Test

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday 03:00 UTC / Sunday 12:00 noon JST
  # No input default: -- defaults live in the env: block below. See doc/work-done.md.
  workflow_dispatch:
    inputs:
      core_repo_url:
        description: 'tapyrus-core git URL (e.g. a fork, to test a branch that only exists there) -- leave blank for config/repos.py''s default'
      core_repo_ref:
        description: 'tapyrus-core ref (branch/tag/sha) -- leave blank for config/repos.py''s default'
      signer_repo_url:
        description: 'tapyrus-signer git URL (e.g. a fork, to test a branch that only exists there) -- leave blank for config/repos.py''s default'
      signer_repo_ref:
        description: 'tapyrus-signer ref (branch/tag/sha) -- leave blank for config/repos.py''s default'
      seeder_repo_url:
        description: 'tapyrus-seeder git URL (e.g. a fork, to test a branch that only exists there) -- leave blank for config/repos.py''s default'
      seeder_repo_ref:
        description: 'tapyrus-seeder ref (branch/tag/sha) -- leave blank for config/repos.py''s default'

      # --- transaction generation (scripts/generate_traffic.py) ---
      tx_round_count:
        description: 'Round-robin send/check/settle cycles to run (3 block-heights and 14 transactions each); also sets the reorg baseline height (tx_round_count + 2) -- see reorg_length. Leave blank for the default -- see README.md''s variable table (defaults live in the env: block below, not restated here to avoid drift).'

      # --- reorg shape ---
      reorg_length:
        description: 'Blocks each isolated group builds past the baseline before reconnecting at the tie. How many blocks past this the winning side needs before the reorg actually triggers is no longer an input -- simulate_reorg.py probes for it live, see doc/scripts.md. Leave blank for the default -- see README.md''s variable table.'

      # --- block interval ---
      round_duration_seconds:
        description: 'tapyrus-signerd round-duration. Leave blank for the default -- see README.md''s variable table.'

      # --- misc ---
      network_id:
        description: 'Tapyrus network id (prod mode -- see doc/work-done.md), used by every core-* node''s rendered tapyrus.conf and the genesis.<id> file tapyrusd looks for. Not yet wired into the seeder (deferred, see the "Bring up tapyrus-seeder and verify it" step). Leave blank for the default -- see README.md''s variable table.'
      docker_build_platform:
        description: 'Docker --platform for image builds; leave empty for the runner''s native platform'

  # Smoke run for this repo's own scripts/compose/workflow changes.
  pull_request:
    paths-ignore:
      - 'doc/**'
  # TEMPORARY: '**' not 'main' -- works around this fork's first-time-contributor
  # approval gate. Narrow to [main] once merged -- see doc/project-plan.md.
  push:
    branches:
      - '**'
    paths-ignore:
      - 'doc/**'

permissions:
  contents: read

concurrency:
  # event_name in the key: a push-triggered smoke run can't cancel a scheduled full run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No literal fallback -- an unset url/ref resolves to config/repos.py's own default.
  DOCKER_BUILD_PLATFORM: ${{ inputs.docker_build_platform || '' }}
  CORE_REPO_URL: ${{ inputs.core_repo_url }}
  CORE_REPO_REF: ${{ inputs.core_repo_ref }}
  SIGNER_REPO_URL: ${{ inputs.signer_repo_url }}
  SIGNER_REPO_REF: ${{ inputs.signer_repo_ref }}
  SEEDER_REPO_URL: ${{ inputs.seeder_repo_url }}
  SEEDER_REPO_REF: ${{ inputs.seeder_repo_ref }}
  PRNG_SEED_BASE: ${{ github.run_id }}
  NETWORK_ID: ${{ inputs.network_id || '1905960821' }}
  CORE_RPC_PORT: '12381'
  # Re-sized against the block-production math in doc/work-done.md's "CI timing
  # budget" note -- see there for the reasoning behind these values.
  TX_ROUND_COUNT: ${{ inputs.tx_round_count || ((github.event_name == 'pull_request' || github.event_name == 'push') && '10' || '60') }}
  ROUND_DURATION: ${{ inputs.round_duration_seconds || '30' }}
  REORG_LENGTH: ${{ inputs.reorg_length || ((github.event_name == 'pull_request' || github.event_name == 'push') && '5' || '30') }}
  MAX_BLOCK_SIZE_NEW: ${{ inputs.max_block_size_new || '2000000' }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    # Smoke: 3h. Full: 6h. Headroom for cold image builds + cargo build --release.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 180 || 360 }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record runner environment
        # Report only, no enforcement -- runs-on: ubuntu-latest is a floating tag
        # GitHub repoints to a new image periodically, with its own default Docker/
        # kernel/package versions, so a hard pinned-baseline diff would need updating
        # every time GitHub moves it or it starts failing builds for no real reason.
        # This just makes what actually ran on a given run visible, in the step log
        # and as a downloadable artifact -- see doc/work-done.md.
        run: |
          {
            echo "## Runner image"
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            echo "## OS"
            cat /etc/os-release
            uname -a
            echo
            echo "## Docker"
            docker version
            docker compose version
            echo
            echo "## Python"
            python3 --version
            echo
            echo "## Rust"
            # Unlike the containerized tapyrus-signer image (pins rust:1.82-bookworm in
            # its own Dockerfile), tapyrus-setup's build (below) runs cargo build
            # --release directly on this runner, against whatever toolchain ubuntu-latest
            # happens to preinstall -- unpinned, so worth recording explicitly.
            rustc --version
            cargo --version
          } | tee environment.txt

      - name: Upload runner environment fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: environment-fingerprint
          path: environment.txt

      - name: Derive CHAIN_HEIGHT_BEFORE_REORG from TX_ROUND_COUNT
        # env: expressions have no arithmetic -- ties the reorg baseline to TX_ROUND_COUNT.
        run: echo "CHAIN_HEIGHT_BEFORE_REORG=$((TX_ROUND_COUNT + 2))" >> "$GITHUB_ENV"

      - name: Derive FEDERATION_CHANGE_HEIGHT from REORG_LENGTH
        run: echo "FEDERATION_CHANGE_HEIGHT=$REORG_LENGTH" >> "$GITHUB_ENV"

      - name: Derive MAX_BLOCK_SIZE_HEIGHT from FEDERATION_CHANGE_HEIGHT
        run: echo "MAX_BLOCK_SIZE_HEIGHT=$FEDERATION_CHANGE_HEIGHT" >> "$GITHUB_ENV"

      - name: Checkout tapyrus-core + tapyrus-signer + tapyrus-seeder
        run: ./scripts/checkout_repos.py

      - name: Build tapyrus-core image (tapyrus/tapyrusd:master-local)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus/tapyrusd:master-local -f workdir/tapyrus-core/Dockerfile workdir/tapyrus-core
      - name: Build node-orchestrator image (tapyrus/tapyrusd:orchestrator)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus/tapyrusd:orchestrator -f docker/orchestrator.Dockerfile docker/
      - name: Build tapyrus-signer image (tapyrus-signer:integration-test)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus-signer:integration-test workdir/tapyrus-signer
      - name: Build tapyrus-seeder image (tapyrus-seeder:integration-test)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus-seeder:integration-test workdir/tapyrus-seeder

      - name: Build tapyrus-setup binary
        run: cd workdir/tapyrus-signer && cargo build --release
      - name: Generate signer-set-a aggpubkey (section 4a steps 1-3)
        run: ./scripts/generate_dev_secrets.py signer-set-a 3 2

      - name: Build unsigned genesis
        run: |
          docker run --rm --entrypoint tapyrus-genesis tapyrus/tapyrusd:master-local \
            -signblockpubkey=$(cat secrets/signer-set-a/aggregated-public-key.txt) \
            > /tmp/unsigned-genesis.hex
      - name: Sign genesis
        run: TAPYRUS_SETUP_THRESHOLD=2 ./scripts/sign_genesis.py signer-set-a /tmp/unsigned-genesis.hex secrets/signer-set-a/genesis.hex

      - name: Render tapyrus.conf
        run: ./scripts/render_tapyrus_conf.py
      - name: Bring up redis
        run: cd docker && docker compose up -d redis
      - name: Bring up tapyrus-seeder and verify it
        run: ./scripts/verify_seeder.py
      - name: Start node orchestrator
        # Recreates the 7 core-* nodes under scripts/container/node_orchestrator.py,
        # which randomly stops/restarts/reindexes/invalidates each one for the rest
        # of the job -- see doc/work-done.md. The script persists NODE_ORCHESTRATOR
        # to $GITHUB_ENV itself (see its own docstring/_persist_env_for_rest_of_job).
        run: ./scripts/start_node_orchestrator.py
      - name: Wait for topology to converge
        run: ./scripts/wait_for_topology.py
      - name: Collect coinbase addresses from each first-layer node
        run: |
          ./scripts/collect_coinbase_addresses.py 12381 12383 12385 --output /tmp/addrs.txt
          printf 'core-1a\ncore-2a\ncore-3a\n' > /tmp/core-rpc-hosts.txt
      - name: Assemble signer configs
        run: |
          ROUND_DURATION="$ROUND_DURATION" ./scripts/assemble_signer_configs.py signer-set-a 2 \
            /tmp/core-rpc-hosts.txt "$CORE_RPC_PORT" redis 6379 /tmp/addrs.txt
      - name: Bring up signers
        # --no-deps: signer-0/1/2 each depends_on a core-1a/2a/3a node
        # (docker/docker-compose.yml) -- without it, `up` also reconciles those
        # already-running dependencies, and GENESIS_BLOCK_WITH_SIG/SEEDER_IP/
        # CORE_*_ARGS being real job-level env vars (persisted by
        # verify_seeder.py, see its own docstring) is what keeps their resolved
        # config from drifting either way. See doc/work-done.md.
        run: cd docker && docker compose up -d --no-deps signer-0 signer-1 signer-2

      - name: Generate traffic (before reorg)
        run: ./scripts/generate_traffic.py "$TX_ROUND_COUNT"

      - name: Reorg
        run: ./scripts/simulate_reorg.py

      - name: Generate traffic (before federation change)
        run: ./scripts/generate_traffic.py 5

      - name: Federation change (aggpubkey rotation)
        run: ./scripts/simulate_federation_change.py

      - name: Generate traffic (before max-block-size change)
        run: ./scripts/generate_traffic.py 5

      - name: Max block size change
        run: ./scripts/simulate_maxblocksize_change.py

      - name: Generate traffic (after max-block-size change)
        run: ./scripts/generate_traffic.py 5

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cd docker
          for c in $(docker compose ps -a --format '{{.Name}}'); do
            docker logs "$c" > "../logs/$c.log" 2>&1 || true
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: logs/
      - name: Teardown
        if: always()
        run: cd docker && docker compose down

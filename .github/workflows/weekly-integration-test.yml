# Weekly cross-repo integration test (tapyrus-core + tapyrus-signer + tapyrus-seeder).
# See doc/weekly-integration-test-plan.md section 3 for the full step-by-step design,
# doc/work-done.md for known issues/lessons learnt/design decisions, and
# doc/project-plan.md for tracked progress.
#
# schedule/workflow_dispatch run the full-scale scenario; pull_request/push (to this
# repo itself, path-filtered) run the same flow at smoke scale -- see the env: block
# below and doc/work-done.md.
name: Weekly Cross-Repo Integration Test

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday 03:00 UTC / Sunday 12:00 noon JST
  # Inputs deliberately have no `default:` -- GitHub Actions doesn't let that field
  # hold an expression, and schedule/pull_request/push runs have no `inputs` context at
  # all, so a workflow_dispatch-only default couldn't be shared with those triggers
  # anyway. Every actual default lives in the env: block below instead, in one place --
  # leave a field blank on a manual dispatch and you get the same value schedule uses.
  workflow_dispatch:
    inputs:
      core_repo_ref:
        description: 'tapyrus-core ref (branch/tag/sha) -- default: master'
      signer_repo_ref:
        description: 'tapyrus-signer ref (branch/tag/sha) -- default: 163_federationChangeTomlSetup'
      seeder_repo_ref:
        description: 'tapyrus-seeder ref (branch/tag/sha) -- default: master'

      # --- reorg shape ---
      chain_height_before_reorg:
        description: 'Baseline chain height to reach (all 7 nodes connected) before splitting for the reorg -- default: 30 (5 on pull_request/push)'
      reorg_loser_blocks:
        description: 'Blocks the losing group builds past the baseline -- default: 10 (2 on pull_request/push)'
      reorg_winner_margin:
        description: 'Extra blocks the winning group builds beyond reorg_loser_blocks -- default: 2 (1 on pull_request/push)'

      # --- transaction mix ---
      tx_total_count:
        description: 'Total number of transactions generated across the run -- default: 20 (4 on pull_request/push)'
      tx_tpc_percent:
        description: 'Percent of tx_total_count that are plain TPC transfers (remainder is colored-coin) -- default: 30'
      tx_interval_seconds:
        description: 'Seconds between each generated transaction -- default: 30 (2 on pull_request/push)'

      # --- block interval ---
      round_duration_seconds:
        description: 'tapyrus-signerd round-duration -- default: 60'

      # --- rotation (scenario step 6) ---
      rotation_height_offset:
        description: 'Blocks ahead of the current tip to schedule signer-set-b''s takeover height -- default: 10 (3 on pull_request/push)'

      # --- max block size change (scenario step 7) ---
      max_block_size_new:
        description: 'New max-block-size value pushed via the xfield change -- default: 2000000'

      # --- determinism ---
      prng_seed_base:
        description: 'Base seed for per-node PRNGs (combined with node index) -- default: github.run_id'

      # --- misc ---
      network_id:
        description: 'Tapyrus dev network id, used for genesis/seeder/RPC network selection -- default: 1905960821'
      slack_log_tail_lines:
        description: 'Lines of the implicated container''s log to inline in the Slack failure report -- default: 100'
      docker_build_platform:
        description: 'Docker --platform for image builds; leave empty for the runner''s native platform'

  # Smoke run for changes to this repo's own scripts/compose/workflow -- proves the
  # pipeline still works end-to-end without waiting for Sunday's full-scale run to find
  # out. Not the plan doc section 6 "not on every PR" non-goal: that's about the
  # full-scale scenario running against every tapyrus-core/tapyrus-signer PR, which
  # stays out of scope. This repo changes rarely, so validating its own PRs is cheap.
  pull_request:
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'config/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REPO_REF: ${{ inputs.core_repo_ref || 'master' }}
  SIGNER_REPO_REF: ${{ inputs.signer_repo_ref || '163_federationChangeTomlSetup' }}
  SEEDER_REPO_REF: ${{ inputs.seeder_repo_ref || 'master' }}
  CHAIN_HEIGHT_BEFORE_REORG: ${{ inputs.chain_height_before_reorg || ((github.event_name == 'pull_request' || github.event_name == 'push') && '5' || '30') }}
  REORG_LOSER_BLOCKS: ${{ inputs.reorg_loser_blocks || ((github.event_name == 'pull_request' || github.event_name == 'push') && '2' || '10') }}
  REORG_WINNER_MARGIN: ${{ inputs.reorg_winner_margin || ((github.event_name == 'pull_request' || github.event_name == 'push') && '1' || '2') }}
  TX_TOTAL_COUNT: ${{ inputs.tx_total_count || ((github.event_name == 'pull_request' || github.event_name == 'push') && '4' || '20') }}
  TX_TPC_PERCENT: ${{ inputs.tx_tpc_percent || '30' }}
  TX_INTERVAL_SECONDS: ${{ inputs.tx_interval_seconds || ((github.event_name == 'pull_request' || github.event_name == 'push') && '2' || '30') }}
  ROUND_DURATION: ${{ inputs.round_duration_seconds || '60' }}
  ROTATION_HEIGHT_OFFSET: ${{ inputs.rotation_height_offset || ((github.event_name == 'pull_request' || github.event_name == 'push') && '3' || '10') }}
  MAX_BLOCK_SIZE_NEW: ${{ inputs.max_block_size_new || '2000000' }}
  PRNG_SEED_BASE: ${{ inputs.prng_seed_base || github.run_id }}
  NETWORK_ID: ${{ inputs.network_id || '1905960821' }}
  SLACK_LOG_TAIL_LINES: ${{ inputs.slack_log_tail_lines || '100' }}
  DOCKER_BUILD_PLATFORM: ${{ inputs.docker_build_platform || '' }}
  CORE_RPC_PORT: '12381'
  CORE_RPC_USER: 'rpcuser'
  CORE_RPC_PASS: 'rpcpassword'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 60 || 360 }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout tapyrus-core + tapyrus-signer + tapyrus-seeder
        run: ./scripts/checkout_repos.py

      - name: Build tapyrus-core image (tapyrus/tapyrusd:master-local)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus/tapyrusd:master-local -f workdir/tapyrus-core/Dockerfile workdir/tapyrus-core
      - name: Build tapyrus-signer image (tapyrus-signer:federation-setup-review)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus-signer:federation-setup-review workdir/tapyrus-signer
      - name: Build tapyrus-seeder image (tapyrus-seeder:integration-test)
        run: |
          docker build ${DOCKER_BUILD_PLATFORM:+--platform "$DOCKER_BUILD_PLATFORM"} \
            -t tapyrus-seeder:integration-test workdir/tapyrus-seeder

      - name: Build tapyrus-setup binary
        run: cd workdir/tapyrus-signer && cargo build --release
      - name: Generate signer-set-a aggpubkey (section 4a steps 1-3)
        run: ./scripts/generate_dev_secrets.py signer-set-a 3 2

      - name: Build unsigned genesis
        run: |
          docker run --rm --entrypoint tapyrus-genesis tapyrus/tapyrusd:master-local \
            -dev -signblockpubkey=$(cat secrets/signer-set-a/aggregated-public-key.txt) \
            > /tmp/unsigned-genesis.hex
      - name: Sign genesis (section 4a steps 4-7)
        run: TAPYRUS_SETUP_THRESHOLD=2 ./scripts/sign_genesis.py signer-set-a /tmp/unsigned-genesis.hex secrets/signer-set-a/genesis.hex

      - name: Bring up redis + 7 core nodes
        run: |
          cd docker
          GENESIS_BLOCK_WITH_SIG=$(cat ../secrets/signer-set-a/genesis.hex) \
            docker compose up -d redis core-1a core-1b core-2a core-2b core-3a core-3b core-7
      - name: Collect coinbase addresses from each first-layer node
        run: |
          ./scripts/collect_coinbase_addresses.py 12381 12383 12385 --output /tmp/addrs.txt
          printf 'core-1a\ncore-2a\ncore-3a\n' > /tmp/core-rpc-hosts.txt
      - name: Assemble signer-set-a configs
        run: |
          ROUND_DURATION="$ROUND_DURATION" ./scripts/assemble_signer_configs.py signer-set-a 2 \
            /tmp/core-rpc-hosts.txt "$CORE_RPC_PORT" "$CORE_RPC_USER" "$CORE_RPC_PASS" redis 6379 /tmp/addrs.txt
      - name: Bring up signer-set-a
        run: |
          cd docker
          GENESIS_BLOCK_WITH_SIG=$(cat ../secrets/signer-set-a/genesis.hex) \
            docker compose up -d signer-0 signer-1 signer-2

      - name: Wait for topology to converge
        run: ./scripts/wait_for_topology.py

      - name: Per-node tx/query/stop-restart + max-block-size change
        run: echo "TODO -- not yet scripted -- see doc/project-plan.md Milestone 3/4"

      - name: Reorg
        run: echo "TODO -- not yet scripted -- see doc/project-plan.md Milestone 3/4"

      - name: Generate signer-set-b aggpubkey (offline ceremony)
        run: ./scripts/generate_dev_secrets.py signer-set-b 3 2
      - name: Sign off rotation handoff + regenerate federations.toml (both entries)
        run: echo "TODO -- not yet scripted -- see doc/project-plan.md Milestone 3/4"

      - name: Confirm rotation took effect
        run: echo "TODO -- not yet scripted -- see doc/project-plan.md Milestone 4"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cd docker
          for c in $(docker compose ps -a --format '{{.Name}}'); do
            docker logs "$c" > "../logs/$c.log" 2>&1 || true
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: logs/
      - name: Teardown
        if: always()
        run: cd docker && docker compose down

      - name: Send Slack report
        if: always()
        run: echo "TODO -- not yet scripted -- see doc/project-plan.md Milestone 4"

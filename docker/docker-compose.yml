# 7-core-node + redis + 3-signer stack --
#
# STATUS: verified end-to-end. Brought up for real (all 7 core nodes + redis + 3
# signer-set-a containers). Two real bugs were found and fixed along the way --
# see "CONNECT/LISTEN DESIGN" and "COMMAND OVERRIDE" below.
#
# CORE IMAGE: uses tapyrus/tapyrusd:master-local, built locally from tapyrus-core's
# real master branch.
#
# Topology (plan doc section 4b):
#   first layer:  core-1a, core-2a, core-3a  -- each is the RPC target for one signer
#                 (signer-0 -> core-1a, signer-1 -> core-2a, signer-2 -> core-3a)
#   second layer: core-1b, core-2b, core-3b  -- each P2P-connected only to its
#                 corresponding first-layer node
#   core-7:       P2P-connected to ALL THREE second-layer nodes (core-1b, core-2b,
#                 core-3b) -- the plan doc's own wording ("any two ... e.g.") only
#                 specifies two, which would leave core-3a/core-3b as an isolated
#                 island with no path to the other 5 nodes. Connecting to all three
#                 keeps the network connected, which the sync/lifecycle/reorg scenario
#                 steps depend on. Deliberate deviation from the doc's literal wording --
#                 confirmed with the team, not an oversight.
#
# All 7 nodes stay on this one flat compose network (not segmented into separate
# Docker networks per edge) -- deliberately, per the plan doc, so a future adversary
# node (connecting P2P to two first-layer nodes) remains buildable without rework.
#
# NETWORK/CONF: each core-* node mounts ./generated/tapyrus.conf (gitignored, rendered
# by scripts/render_tapyrus_conf.py before `docker compose up` -- see the workflow)
# with networkid=$NETWORK_ID -- see doc/work-done.md.
#
services:
  redis:
    image: redis:5.0-alpine
    command: redis-server

  # --- first layer: one per signer, each an RPC target. No -connect needed --
  # (see "CONNECT/LISTEN DESIGN" above) -- these just accept their -b sibling's
  # inbound connection via plain default listen=1.
  core-1a:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    ports:
      - '12381:12381'

  core-2a:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    ports:
      - '12383:12381'

  core-3a:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    ports:
      - '12385:12381'

  # --- second layer: dials its first-layer parent, and re-enables listen=1 --
  # so core-7 can also dial in to it.
  core-1b:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    command: tapyrusd -datadir=$${DATA_DIR} -conf=$${CONF_DIR}/tapyrus.conf -connect=core-1a -listen=1
    ports:
      - '12382:12381'

  core-2b:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    command: tapyrusd -datadir=$${DATA_DIR} -conf=$${CONF_DIR}/tapyrus.conf -connect=core-2a -listen=1
    ports:
      - '12384:12381'

  core-3b:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    command: tapyrusd -datadir=$${DATA_DIR} -conf=$${CONF_DIR}/tapyrus.conf -connect=core-3a -listen=1
    ports:
      - '12386:12381'

  # --- node 7: dials all three second-layer nodes; nothing dials into it, so
  # no -listen=1 override needed here.
  core-7:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    command: >-
      tapyrusd -datadir=$${DATA_DIR} -conf=$${CONF_DIR}/tapyrus.conf
      -connect=core-1b -connect=core-2b -connect=core-3b
    ports:
      - '12387:12381'

  # --- signer-set-a: RPC target is each signer's first-layer node ----------
  signer-0:
    image: tapyrus-signer:integration-test
    volumes:
      - ../runtime/signers/node-0:/etc/tapyrus
    depends_on:
      - redis
      - core-1a

  signer-1:
    image: tapyrus-signer:integration-test
    volumes:
      - ../runtime/signers/node-1:/etc/tapyrus
    depends_on:
      - redis
      - core-2a

  signer-2:
    image: tapyrus-signer:integration-test
    volumes:
      - ../runtime/signers/node-2:/etc/tapyrus
    depends_on:
      - redis
      - core-3a

  # --- signer-set-b: the rotation target (scripts/simulate_federation_change.py).
  # Only 2 new containers, not 3 -- signer-0/node-0's identity is deliberately REUSED
  # (not regenerated) as one of signer-set-b's 3 members too, so it stays a valid
  # signer straight through the handoff (its federations.toml gains a second, full
  # member entry rather than losing membership like signer-1/signer-2 do). signer-b-1
  # and signer-b-2 are the two genuinely new identities, brought up alongside
  # signer-set-a (not replacing it yet) -- a running tapyrus-signerd only finds its
  # own signing material by matching its OWN public-key against federations.toml's
  # node-vss, so a container with no matching entry in the CURRENTLY active
  # federation can't contribute (see doc/work-done.md), which is why signer-b-1/
  # signer-b-2 need to be up and idle before the scheduled height, not started at it.
  # Same RPC targets as their signer-set-a counterparts (signer-b-1 -> core-2a, etc.)
  # -- RPC access isn't exclusive to one client, and it avoids needing more core nodes
  # / a topology change just for this.
  # signer-0/signer-1/signer-2 themselves are NEVER stopped or restarted for this --
  # their federations.toml is live-reloaded in place instead.
  # Both signer sets share this same redis instance, and the tapyrus-signer
  # round-coordination broadcast channel is global (not scoped per federation) --
  # cross-talk between the two sets while both are up is a real risk worth watching
  # for in a live run.
  signer-b-1:
    image: tapyrus-signer:integration-test
    volumes:
      - ../runtime/signers-b/node-1:/etc/tapyrus
    depends_on:
      - redis
      - core-2a

  signer-b-2:
    image: tapyrus-signer:integration-test
    volumes:
      - ../runtime/signers-b/node-2:/etc/tapyrus
    depends_on:
      - redis
      - core-3a

  # --- tapyrus-seeder: seeds directly from all 7 core-* nodes (one -s each, all
  # supported -- main.cpp's -s parsing just appends each to a vector) rather than
  # just core-1a left to crawl/discover the rest via P2P gossip -- this fixed
  # -connect topology never organically propagates ADDR gossip at all, so crawling
  # from a single node would never find the other 6. See doc/work-done.md's Lessons
  # learnt for the full investigation (also covers why the `default:` network below
  # needs a custom subnet at all).
  #
  # core-7 is seeded too, and expected to always test BAD: it's the one node whose
  # command: sets -connect without an offsetting -listen=1 (see "CONNECT/LISTEN
  # DESIGN" above), so tapyrus-core auto-disables its listening entirely -- nothing
  # (seeder included) can ever open an inbound connection to it. Deliberate: a real
  # demonstration that the seeder only ever calls a node "good" once it's genuinely
  # reachable, not just "a container that exists" -- see scripts/verify_seeder.py.
  # -i/-s hardcode 1905960821 (not wired to NETWORK_ID -- deferred, see
  # render_tapyrus_conf.py's own note on why the seeder isn't wired to it yet either).
  # -s's port is 2357, prod mode's default P2P port (confirmed against a real
  # container's "Bound to 0.0.0.0:2357" log line) -- NOT core-*'s rpcport
  # (12381/83/85). See render_tapyrus_conf.py and doc/work-done.md for why core-* has
  # no explicit `port=` override: -connect=<service-name> (no port suffix) resolves
  # against the chain's default P2P port too, so both sides have to agree on that
  # same default, not a value pinned here or in the conf.
  # entrypoint is fully overridden below rather than appended to,
  # since this image's ENTRYPOINT is a plain JSON-array exec form (no bash -c wrapper
  # like tapyrusd's, so no COMMAND OVERRIDE gotcha here). -h/-n/-m are placeholder
  # values -- harmless, since nothing outside this compose network ever queries them.
  seeder:
    image: tapyrus-seeder:integration-test
    entrypoint:
      - tapyrusseed
      - -t
      # Default (96) is tuned for crawling the entire real Bitcoin/Tapyrus network --
      # 7 addresses total here, so 2 crawler threads is already more than enough
      # concurrency; a lower thread count also keeps main.cpp's idle-retry backoff
      # (`rand() % (500 * nThreads)`) small, so an idle crawler doesn't sit out an
      # oversized random wait before its next poll.
      - '2'
      - -i
      - '1905960821'
      - -s
      - '1905960821:core-1a:2357'
      - -s
      - '1905960821:core-1b:2357'
      - -s
      - '1905960821:core-2a:2357'
      - -s
      - '1905960821:core-2b:2357'
      - -s
      - '1905960821:core-3a:2357'
      - -s
      - '1905960821:core-3b:2357'
      - -s
      - '1905960821:core-7:2357'
      - -h
      - seed.tapyrus-integration-tests.local
      - -n
      - ns.tapyrus-integration-tests.local
      - -m
      - test.tapyrus-integration-tests.local
    ports:
      - '5390:53/udp'
      - '5390:53/tcp'
    depends_on:
      - core-1a
      - core-1b
      - core-2a
      - core-2b
      - core-3a
      - core-3b
      - core-7

  # --- seeder-test-node: NOT part of the normal 7-node scenario, brought up only by
  # scripts/verify_seeder.py -- a fresh 8th tapyrus-core node with no -connect at
  # all, relying purely on tapyrus-core's own DNS-seed client (-addseeder,
  # federationparams.cpp) against the real seeder, to prove a brand-new node can
  # genuinely auto-bootstrap onto the network -- not just that dig resolves
  # something. Only works given the `default:` network's custom subnet below (see
  # doc/work-done.md's Lessons learnt for why). SEEDER_IP (the seeder container's
  # actual IP, resolved by the verify script itself via `docker inspect` -- compose's
  # dns: field takes a literal, not a service name) overrides this node's resolver
  # so its -addseeder lookup actually reaches our seeder rather than Docker's own
  # embedded DNS, which has no idea what "seed.tapyrus-integration-tests.local" is.
  seeder-test-node:
    image: tapyrus/tapyrusd:master-local
    environment:
      GENESIS_BLOCK_WITH_SIG: ${GENESIS_BLOCK_WITH_SIG}
    volumes:
      - ./generated/tapyrus.conf:/etc/tapyrus/tapyrus.conf
    dns:
      - ${SEEDER_IP}
    command: tapyrusd -datadir=$${DATA_DIR} -conf=$${CONF_DIR}/tapyrus.conf -addseeder=seed.tapyrus-integration-tests.local
    ports:
      - '12388:12381'
    depends_on:
      - seeder

# Custom subnet, not Docker's own default bridge range: both tapyrus-core
# (CAddrMan::Add_) and tapyrus-seeder (its own, separate IsGood()) unconditionally
# refuse any address failing CNetAddr::IsRoutable() (netaddress.cpp), which excludes
# every RFC1918 private range AND every "officially reserved for testing" range
# (RFC 5737 TEST-NET, RFC2544, RFC6598, link-local, loopback) -- there is no IANA
# special-purpose block that both looks like a real address and passes this check.
# 51.51.51.0/24 is simply outside all of the above (confirmed by reading every
# Is*() function IsRoutable() calls, not guessed) -- an arbitrary, clearly-deliberate
# choice (repeated octet), not a real allocation; safe regardless, since this
# network is a fully isolated Docker bridge, NAT'd outbound and never actually
# reachable from or routed to the real internet. See doc/work-done.md's Lessons
# learnt for the full investigation, including why RFC 5737 was tried first and
# didn't work.
networks:
  default:
    ipam:
      config:
        - subnet: 51.51.51.0/24
